workflows:
  build-admin-apk:
    name: Build Admin APK
    max_build_duration: 15
    environment:
      flutter: stable
    scripts:
      - name: Install dependencies
        script: |
          flutter pub get
      - name: Build Admin APK
        script: |
          flutter build apk -t lib/main_admin.dart --release
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk

  build-guest-apk:
    name: Build Guest APK
    max_build_duration: 15
    environment:
      flutter: stable
    scripts:
      - name: Install dependencies
        script: |
          flutter pub get
      - name: Build Guest APK
        script: |
          flutter build apk -t lib/main_guest.dart --release
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
